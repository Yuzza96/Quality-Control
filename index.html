<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Quality Control Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- liquid-glass refraction: gentle turbulence displacement, referenced from styles.css as url(#lg-refract) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="lg-refract" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="3" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
